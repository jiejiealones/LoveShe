name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: node --check loveshe/static/app.js
      - run: python scripts/check_release.py
      - run: python -m pip install detect-secrets==1.5.0
      - run: python scripts/scan_secrets.py
      - run: python scripts/build_release.py
      - run: python -m pip install --no-deps .
      - run: loveshe --help
